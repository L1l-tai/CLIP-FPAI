# ========== 1. 本地数据 ==========
root_path: '/opt_share/Imagenet2012'          # ImageNet val 上一级目录（可换 your set）
dataset: 'imagenet'                              # 如本地文件夹叫 ImageNet-1k 就写 imagenet

# ========== 2. 本地 CLIP 权重 ==========
backbone: 'ViT-B/32'                              # ① 架构名
model_path: '/home/yangyi/code/All_for_one/download/ViT-B-32-laion2b-s34b-b79k/open_clip_pytorch_model.bin'  # ② 权重文件
cache_dir: './caches/ViT-B-32'                    # ③ 缓存目录（键/值/预提特征）

# ========== 3. 其余超参（保持官方推荐） ==========
shots: 16
augment_epoch: 10
train_epoch: 20
lr: 0.001
init_beta: 1
init_alpha: 1.17
search_hp: True
search_scale: [7, 3]
search_step: [200, 20]

# ========== 4. 缓存开关 ==========
load_cache: False     # 第一次跑完改成 True 可秒加载
load_pre_feat: False   # 同上