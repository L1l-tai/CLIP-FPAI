[parse]
net_name = "vision_model_hadamard"
framework = "onnx"
# ViT-B/32 标准输入是 224x224
inputs = [ 1, 224, 224, 3]
inputs_layout = "NHWC"
inputs_dtype = "FP32"    
pre_method = "nop"
pre_mean = [ 0,0,0 ] 
pre_scale = [ 1,1,1 ]
# CLIP 官方预处理：(x - mean) / std
# 这里的 pre_scale = 1/std，均值和标准差已映射到 0-255

channel_swap = [ 0, 1, 2 ] # CLIP 官方为 RGB，若输入 BGR 图片则需交换
network = "./fmodel/vision_model_hadamard.onnx"
jr_path = "imodel/vision_model_hadamard/"
target = "zhuge"    

[optimize]
target = "zhuge"
json = "imodel/vision_model_hadamard//vision_model_hadamard_parsed.json"
raw = "imodel/vision_model_hadamard//vision_model_hadamard_parsed.raw"
log_path = "./imodel/optimize"	
jr_path = "imodel/vision_model_hadamard/"

[quantize]
saturation = "kld"  # Transformer 模型强烈建议使用 kld
forward_dir = "./qtset/coco"
forward_list = "./qtset/coco.txt"
qdtype = "fp16" 
json = "imodel/vision_model_hadamard//vision_model_hadamard_optimized.json"
raw = "imodel/vision_model_hadamard//vision_model_hadamard_optimized.raw"
jr_path = "imodel/vision_model_hadamard/"
per = "channel"
target = "zhuge"

[adapt]
target = "zhuge"
json = "imodel/vision_model_hadamard//vision_model_hadamard_optimized.json"
raw = "imodel/vision_model_hadamard//vision_model_hadamard_optimized.raw"
jr_path = "imodel/vision_model_hadamard/"
# 注意：CLIP 是特征提取模型，通常不需要类似 YOLO 的 DetPost 后处理插件
# 如果只是为了跑通流程，可以不加 pass_on；如果编译器报错，请咨询是否需要特定的 ViT 后处理

[generate]
json = "imodel/vision_model_hadamard//vision_model_hadamard_adapted.json"
raw = "imodel/vision_model_hadamard//vision_model_hadamard_adapted.raw"
jr_path = "imodel/vision_model_hadamard/"

