# CLIP 实时分类 (方案三) 配置文件
# 用法: ./clip_dual clip_config.yaml

# 相机/HDMI 配置 (复旦微原有 yaml, 不要改它, 这里只引用路径)
camera_yaml: "/root/fpai_demo_app/examples/1/2/configs/ZG/sdicamera+yolov5+hdmi.yaml"

# 图像编码器 (FP32 版, CPU归一化)
vis_json: "imodel/vit_b32/clip_vit_b32_ZG.json"
vis_raw:  "imodel/vit_b32/clip_vit_b32_ZG.raw"

# 文本编码器中间段
text_json: "imodel/ZG/text_middle_ZG.json"
text_raw:  "imodel/ZG/text_middle_ZG.raw"

# 文本数据目录 (token_emb.bin / pos_emb.bin / text_proj.bin / bpe词表)
data_dir: "board_data/"

# 初始标签文件 (每行一个标签; 启动时批量加载, 之后可运行时增删)
labels_txt: "board_data/labels.txt"

# 每隔多少帧做一次 CLIP 分类
clip_interval: 10
